<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="canonical" href="https://sapiensfirst.org/careers">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Careers — Sapiens First</title>
  <meta name="description" content="Explore open roles at Sapiens First. Help build political power to ensure technology serves the common good.">
  <link rel="icon" type="image/png" sizes="32x32" href="favicons/favicon-32x32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@300;400;500;600;700;800;900&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&family=Special+Elite&display=swap" rel="stylesheet">
  <script>document.documentElement.classList.add('js'); if (!('IntersectionObserver' in window)) document.documentElement.classList.add('no-io');</script>
  <link rel="stylesheet" href="shared.css">
  <script src="config.js"></script>
  <style>
    .careers-page { width: min(900px, calc(100% - 40px)); margin: 0 auto; padding: 64px 0 100px; }
    .careers-page h1 { max-width: none; font-size: clamp(3.5rem, 8vw, 5rem); line-height: 1; }
    .careers-intro { max-width: 650px; margin: 24px 0 56px; font-size: 19px; line-height: 1.65; }
    .careers-page h2 { font-family: var(--font-body); font-size: 22px; line-height: 1.4; text-transform: none; letter-spacing: -.02em; margin-bottom: 20px; }
    .job-listing { display: flex; align-items: center; justify-content: space-between; gap: 24px; padding: 28px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
    .job-listing h3 { font-size: 21px; line-height: 1.4; margin-bottom: 10px; }
    .job-listing p { color: #53504b; font-size: 18px; line-height: 1.7; }
    .job-listing:hover h3 { text-decoration: underline; text-underline-offset: 4px; }
    .job-listing-arrow { font-size: 28px; }
    @media (max-width: 600px) { .careers-page { padding: 40px 0 64px; } .careers-intro { margin-bottom: 40px; } }
  </style>
</head>
<body>
<header class="site-header"></header>
<main class="careers-page">
  <h1>Careers</h1>
  <p class="careers-intro">Help build political power to ensure technology serves the common good. Join a small team with high ownership, fast iteration, and a strong bias toward shipping.</p>
  <section aria-labelledby="open-roles">
    <h2 id="open-roles">Open roles</h2>
    <a class="job-listing" href="/careers/builder" data-page-link="careers/builder">
      <div>
        <h3>AI-Native Builder (Contract)</h3>
        <p>Remote · India preferred · 20 or 40 hours/week · 3 months</p>
      </div>
      <span class="job-listing-arrow" aria-hidden="true">→</span>
    </a>
  </section>
</main>
<footer class="site-footer"></footer>
<script src="nav.js"></script>
<script src="footer.js"></script>
</body>
</html>
