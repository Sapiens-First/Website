<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="canonical" href="https://sapiensfirst.org/join">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Join — Sapiens First</title>
  <meta name="description" content="Become a Sapiens First organizer — attend an intro workshop, join our community, and host events in your city.">
  <meta property="og:title" content="Join Sapiens First">
  <meta property="og:description" content="Attend an intro workshop, join our community, and host events in your city.">
  <meta property="og:url" content="https://sapiensfirst.org/join">
  <meta property="og:type" content="website">
  <!-- BUILD:HEAD-COMMON:START -->
  <!-- Shared assets: edit partials/head-common.html, then run python3 build.py.
       Keep page titles, descriptions, canonical URLs, and social tags outside this block. -->
  <link rel="icon" type="image/png" sizes="32x32" href="favicons/favicon-32x32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@300;400;500;600;700;800;900&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&family=Special+Elite&display=swap" rel="stylesheet">
  <script>document.documentElement.classList.add('js'); if (!('IntersectionObserver' in window)) document.documentElement.classList.add('no-io');</script>
  <link rel="stylesheet" href="shared.css">
  <script src="config.js"></script>
  <!-- BUILD:HEAD-COMMON:END -->
  <style>
    /* join.html — no dedicated mockup; restyled to match the visual language
       established by about.html/fellowship.html (kicker/hero/label/underline/
       btn/section rhythm) so it reads as a natural sibling page. Same
       inner-page type-scale overrides as about/fellowship — see those files
       for why shared.css's bare h1/h2/.deck/.btn/etc. need overriding here. */
    h1 { max-width: 9ch; font-size: clamp(4rem, 8.4vw, 8.4rem); }
    h2 { font-size: clamp(2.5rem, 4.6vw, 4.6rem); line-height: .98; }
    .deck { font-size: clamp(1.1rem, 1.7vw, 1.4rem); line-height: 1.5; font-weight: 500; }
    .hero-copy p {
      max-width: 34ch; margin: 30px 0 26px;
      font-size: clamp(1.1rem,1.6vw,1.4rem); line-height: 1.45; font-weight: 600;
    }
    .hero-copy { padding-top: 40px; padding-bottom: 40px; }
    .hero-copy h1 { font-size: clamp(3rem, 6vw, 5rem); }
    .actions { position: relative; z-index: 2; }
    .btn { padding: 16px 22px; font-size: 14px; }
    .poster { font-size: clamp(.95rem,1.7vw,1.4rem); }
    .poster.alt { bottom: 32%; }
    .underline:after { height: 6px; bottom: -6px; }
    .hero-copy:after { content: none; }

    section { border-bottom: 2px solid var(--ink); }
    .section { padding: 100px 0; }
    .section-compact { padding: 60px 0; }

    /* ─── SPREAD THE WORD ── */
    .share-buttons { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 30px; }
    .share-url-row { display: flex; align-items: center; gap: 10px; margin-top: 16px; }

    @media (max-width: 768px) {
      .section { padding: 56px 0; }
      .section-compact { padding: 40px 0; }
    }
    @media (max-width: 600px) {
      h1 { font-size: clamp(3rem,15vw,4.6rem); max-width: 9ch; }
      h2 { font-size: clamp(2.1rem,11vw,3.2rem); }
      .hero-copy p { font-size: 1.02rem; max-width: none; }
      .hero-art { min-height: 320px; }
      .sun { width: 230px; height: 230px; top: 40px; right: -70px; }
      .face { width: 180px; height: 280px; left: 10%; bottom: -56px; }
      .burst { width: 120px; height: 120px; left: 8%; top: 11%; }
      .poster { font-size: .85rem; padding: 9px 11px; bottom: 12%; right: 6%; }
      .share-buttons { flex-direction: column; }
      .share-url-row { flex-direction: column; align-items: stretch; }
    }
  </style>
</head>
<body>

<header class="site-header"></header>

<main>
  <section class="hero">
    <div class="hero-copy">
      <div class="kicker">Get Involved</div>
      <h1>Join the <span class="marker">revolution.</span></h1>
      <p>Interested in becoming a member? Leave your email and we'll be in touch about getting involved.</p>
      <form class="signup-row" id="signup" action="#" method="post">
        <input type="email" name="email" autocomplete="email" placeholder="Email address" aria-label="Email address" required>
        <button class="btn primary" type="submit">Keep me posted →</button>
      </form>
    </div>
    <div class="hero-art" aria-hidden="true">
      <div class="sun"></div>
      <div class="burst"></div>
      <div class="face"></div>
      <div class="poster">People<br>power</div>
      <div class="poster alt">Show up</div>
      <div class="confetti c1"></div><div class="confetti c2"></div><div class="confetti c3"></div><div class="confetti c4"></div>
      <i style="position:absolute;left:10%;top:8%;z-index:2;color:var(--ink);transform:rotate(-6deg)"><svg class="bird" viewBox="0 0 24 12"><path d="M1 9C4 2 8 2 12 7C16 2 20 2 23 9"/></svg></i>
      <i style="position:absolute;left:20%;top:16%;z-index:2;color:var(--ink);transform:rotate(4deg) scale(.7)"><svg class="bird" viewBox="0 0 24 12"><path d="M1 9C4 2 8 2 12 7C16 2 20 2 23 9"/></svg></i>
    </div>
  </section>


  <!-- ═══════════ ONION LEVELS ═══════════
  <section class="section">
    <div class="container">

      <p class="body-large reveal"> We're building out our infrastructure. If you sign up for emails, we'll let you know when we launch our upcoming programs.</p>


      <div class="tier-cards">

        <div class="flip-card reveal">
          <div class="flip-card-inner">
            <div class="flip-card-face flip-card-face-front">
              <div class="flip-card-title">Supporter</div>
              <div class="flip-card-hrs">0–1 hrs / week</div>
            </div>
            <div class="flip-card-face flip-card-face-back">
              <ul class="flip-card-list">
                <li>Get our emails and stay informed</li>
                <li>Show up to events and actions when you can</li>
              </ul>
            </div>
          </div>
        </div>

        <div class="flip-card reveal reveal-d1">
          <div class="flip-card-inner">
            <div class="flip-card-face flip-card-face-front">
              <div class="flip-card-title">Member</div>
              <div class="flip-card-hrs">1–2 hrs / week</div>
            </div>
            <div class="flip-card-face flip-card-face-back">
              <ul class="flip-card-list">
                <li>Support the movement through membership dues (dues waivers available)</li>
                <li>Connect with fellow activists, vote on leadership and campaigns</li>
              </ul>
            </div>
          </div>
        </div>

        <div class="flip-card reveal reveal-d1">
          <div class="flip-card-inner">
            <div class="flip-card-face flip-card-face-front">
              <div class="flip-card-title">Organizer</div>
              <div class="flip-card-hrs">1–3 hrs / week</div>
            </div>
            <div class="flip-card-face flip-card-face-back">
              <ul class="flip-card-list">
                <li>Run events and campaigns, with support from our team</li>
                <li>Participate in working groups to advance our mission</li>
              </ul>
            </div>
          </div>
        </div>

        <div class="flip-card reveal reveal-d2">
          <div class="flip-card-inner">
            <div class="flip-card-face flip-card-face-front">
              <div class="flip-card-title">Leader</div>
              <div class="flip-card-hrs">3+ hrs / week</div>
            </div>
            <div class="flip-card-face flip-card-face-back">
              <ul class="flip-card-list">
                <li>Empower others through mentorship and trainings</li>
                <li>Lead large-scale actions and campaigns</li>
              </ul>
            </div>
          </div>
        </div>

      </div>
    </div>
  </section>
  -->

  <section class="section section-compact">
    <div class="container">
      <div class="label alt-blue">Spread the Word</div>
      <h2 style="margin-top:18px">Tell a <span class="underline blue">friend.</span></h2>
      <div class="share-buttons">
        <a class="btn" id="share-x" href="#" target="_blank" rel="noopener">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-4.714-6.231-5.401 6.231H2.746l7.73-8.835L1.254 2.25H8.08l4.259 5.63 5.905-5.63zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
          X / Twitter
        </a>
        <a class="btn" id="share-fb" href="#" target="_blank" rel="noopener">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
          Facebook
        </a>
        <a class="btn" id="share-wa" href="#" target="_blank" rel="noopener">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
          WhatsApp
        </a>
      </div>
      <div class="share-url-row">
        <div class="share-url" id="share-url-display"></div>
        <button class="btn copy-btn" id="copy-link" title="Copy link" style="padding:13px 16px;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
        </button>
      </div>
    </div>
  </section>
</main>

<footer class="site-footer"></footer>

<script src="signup.js"></script>
<script>
  wireSignupForm(document.querySelector('#signup'), { interest: 'membership' });

  const ORG_URL = SITE_CONFIG.JOIN_URL;
  document.getElementById('share-url-display').textContent = ORG_URL.replace(/^https?:\/\//, '');
  const SHARE_TEXT = 'Want to fight for AI accountability? Become a Sapiens First organizer: ';
  document.getElementById('share-x').href  = 'https://x.com/intent/tweet?text=' + encodeURIComponent(SHARE_TEXT) + '&url=' + encodeURIComponent(ORG_URL);
  document.getElementById('share-fb').href = 'https://www.facebook.com/sharer/sharer.php?u=' + encodeURIComponent(ORG_URL);
  document.getElementById('share-wa').href = 'https://wa.me/?text=' + encodeURIComponent(SHARE_TEXT + ' ' + ORG_URL);
  document.getElementById('copy-link').addEventListener('click', function () {
    navigator.clipboard.writeText(ORG_URL).then(() => { this.classList.add('copied'); setTimeout(() => this.classList.remove('copied'), 2000); });
  });
</script>
<script src="nav.js"></script>
<script src="footer.js"></script>
</body>
</html>
