<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="canonical" href="https://sapiensfirst.org/learn">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guide &mdash; Sapiens First</title>
  <meta name="description" content="The Sapiens First guide to AI, people power, and how to make change.">
  <meta property="og:url" content="https://sapiensfirst.org/learn">
  <meta property="og:type" content="website">
  <!-- BUILD:HEAD-COMMON:START -->
  <!-- Shared assets: edit partials/head-common.html, then run python3 build.py.
       Keep page titles, descriptions, canonical URLs, and social tags outside this block. -->
  <link rel="icon" type="image/png" sizes="32x32" href="favicons/favicon-32x32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@300;400;500;600;700;800;900&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&family=Special+Elite&display=swap" rel="stylesheet">
  <script>document.documentElement.classList.add('js'); if (!('IntersectionObserver' in window)) document.documentElement.classList.add('no-io');</script>
  <link rel="stylesheet" href="shared.css">
  <script src="config.js"></script>
  <!-- BUILD:HEAD-COMMON:END -->
  <style>
    .page-hero { padding: 64px 0 56px; background: var(--paper); }
    .page-hero .container, .guide-section > .container { max-width: 1120px; }
    .page-title { max-width: none; font-size: clamp(3rem, 6.5vw, 6rem); line-height: .98; text-align: left; opacity: 1; animation: none; }
    .guide-intro { max-width: 52ch; margin-top: 28px; font-size: clamp(1.125rem, 1.7vw, 1.375rem); line-height: 1.55; }
    .guide-section { padding: 56px 0 96px; }
    .guide-layout { display: grid; grid-template-columns: 248px minmax(0, 1fr); gap: 64px; align-items: start; }
    .guide-sidebar { position: sticky; top: 108px; max-height: calc(100dvh - 132px); overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--border) transparent; padding-right: 16px; }
    .guide-main { min-width: 0; }
    .contents-toggle { cursor: pointer; padding: 0 0 16px; border-bottom: 2px solid var(--ink); font: 800 24px/1.2 var(--font-display); text-transform: uppercase; }
    .toc { padding: 4px 0; }
    .toc-group-header { margin: 20px 0 6px; padding-top: 18px; border-top: 1px solid var(--border); }
    .toc-group-header:first-child { margin-top: 12px; padding-top: 0; border-top: 0; }
    .toc a { color: var(--ink); text-decoration: none; border: 0; overflow-wrap: anywhere; }
    .toc-group-header a { display: block; padding: 8px; font: 800 20px/1.2 var(--font-display); text-transform: uppercase; }
    .toc-h2-row { display: flex; align-items: center; }
    .toc-h2-link { flex: 1; min-width: 0; padding: 10px 8px 10px 32px; font-size: 16px; line-height: 1.4; }
    .toc-chevron + .toc-h2-link { padding-left: 0; }
    .toc-chevron { flex-shrink: 0; width: 32px; height: 44px; display: grid; place-items: center; background: none; border: 0; cursor: pointer; color: var(--ink); font-size: 24px; }
    .toc-chevron.open { transform: rotate(90deg); }
    .toc-h3-list { list-style: none; padding: 0 0 8px 32px; margin: 0; display: none; }
    .toc-h3-list.open { display: block; }
    .toc-h3-list a { display: block; padding: 9px 8px; font-size: 15px; line-height: 1.45; }
    .toc a:hover, .toc a.toc-active { background: var(--yellow); color: var(--ink); }
    .toc a.toc-active { font-weight: 700; }
    main a:focus-visible, .contents-toggle:focus-visible, .toc-chevron:focus-visible { outline: 3px solid var(--blue); outline-offset: 3px; }

    .doc-body { font: 400 clamp(1.125rem, 1.45vw, 1.25rem)/1.75 var(--font-body); color: var(--ink); overflow-wrap: anywhere; }
    .doc-body h1, .doc-body h2, .doc-body h3, .doc-body h4 { max-width: none; color: var(--ink); text-wrap: balance; scroll-margin-top: 112px; }
    .doc-body h1 { font: 800 clamp(2.5rem, 4vw, 3.5rem)/1.05 var(--font-display); letter-spacing: -.02em; text-transform: uppercase; margin: 80px 0 28px; padding-top: 40px; border-top: 3px solid var(--ink); }
    .doc-body h1:first-of-type { margin-top: 0; padding-top: 0; border-top: 0; }
    .doc-body h2 { font: 800 clamp(2rem, 3vw, 2.5rem)/1.1 var(--font-display); letter-spacing: -.01em; text-transform: uppercase; margin: 48px 0 24px; }
    .doc-body h3 { font: 700 clamp(1.5rem, 2.3vw, 1.875rem)/1.2 var(--font-display); text-transform: uppercase; margin: 36px 0 18px; }
    .doc-body h4 { font: 700 1.125rem/1.4 var(--font-body); margin: 28px 0 14px; }
    .doc-body p { font: inherit; color: inherit; margin: 0 0 24px; }
    .doc-body p:empty { display: none; }
    .doc-body ul, .doc-body ol { font: inherit; color: inherit; padding-left: 1.4em; margin: 0 0 24px; }
    .doc-body ul { list-style: disc; }
    .doc-body ol { list-style: decimal; }
    .doc-body li { margin-bottom: 12px; }
    .doc-body li:last-child { margin-bottom: 0; }
    .doc-body li > p { margin-bottom: 12px; }
    .doc-body ul ul, .doc-body ol ol, .doc-body ul ol, .doc-body ol ul { margin: 12px 0 0; }
    .doc-body a { color: inherit; text-decoration: underline; text-decoration-color: var(--red); text-underline-offset: 4px; text-decoration-thickness: 2px; }
    .doc-body a:hover { text-decoration-color: var(--ink); }
    .doc-body strong { font-weight: 700; }
    .doc-body em { font-style: italic; }
    .doc-body img { max-width: 100%; height: auto; }
    .doc-body table { display: block; max-width: 100%; width: 100%; overflow-x: auto; border-collapse: collapse; margin: 28px 0; }
    .doc-body td, .doc-body th { border: 1px solid var(--border); padding: 14px 16px; vertical-align: top; font-size: 17px; line-height: 1.6; }
    .doc-body tr:first-child td, .doc-body th { background: #e5efff; font-weight: 700; }
    .loading-state, .empty-state { padding: 32px; border: 2px solid var(--ink); font-size: 18px; line-height: 1.6; text-align: left; letter-spacing: normal; text-transform: none; }

    @media (max-width: 900px) {
      .guide-layout { grid-template-columns: minmax(0, 1fr); gap: 36px; }
      .guide-sidebar { position: static; max-height: none; padding: 0; overflow: visible; }
      .guide-contents { border: 2px solid var(--ink); background: #fff; padding: 18px 20px; }
      .contents-toggle { padding: 0; border: 0; font-size: 22px; }
      .guide-contents[open] .contents-toggle { padding-bottom: 16px; border-bottom: 1px solid var(--border); }
      .guide-contents .toc { max-height: 55dvh; overflow-y: auto; margin-top: 12px; }
    }
    @media (max-width: 600px) {
      .page-hero { padding: 40px 0; }
      .page-title { font-size: clamp(2.8rem, 12vw, 4rem); }
      .guide-intro { margin-top: 24px; }
      .guide-section { padding: 28px 0 64px; }
      .doc-body h1 { margin-top: 56px; padding-top: 32px; }
    }
  </style>
</head>
<body>

  <header class="site-header"></header>

  <div class="page-hero">
    <div class="container">
      <div class="kicker">Learn · Organize · Act</div>
      <h1 class="page-title">Sapiens' Guide to<br><span class="title-accent">Revolution</span></h1>
      <p class="guide-intro">A practical guide to AI, people power, and organizing for change.</p>
    </div>
  </div>

  <main>
    <section class="guide-section">
      <div class="container">
        <div class="guide-layout">
          <aside class="guide-sidebar">
            <details class="guide-contents" open>
              <summary class="contents-toggle">Contents</summary>
              <div id="toc-container"></div>
            </details>
          </aside>
          <div class="guide-main">
            <div id="doc-content">
              <div class="loading-state">Loading guide...</div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer"></footer>

  <script>
    const contents = document.querySelector('.guide-contents');
    const mobileGuide = window.matchMedia('(max-width: 900px)');
    function syncContents() { contents.open = !mobileGuide.matches; }
    syncContents();
    mobileGuide.addEventListener('change', syncContents);

    const DOC_ID = SITE_CONFIG.GUIDE_DOC_ID;
    const EXPORT_URL = 'https://docs.google.com/document/d/' + DOC_ID + '/export?format=html';

    // Parse Google's exported CSS to map class names -> font properties
    function parseStyleBlock(css) {
      var map = {};
      var re = /\.([\w-]+)\s*\{([^}]*)\}/g;
      var m;
      while ((m = re.exec(css)) !== null) {
        var cls = m[1], body = m[2], props = {};
        var fs = body.match(/font-size:\s*([\d.]+)pt/);
        if (fs) props.size = parseFloat(fs[1]);
        var fw = body.match(/font-weight:\s*(\d+|bold)/);
        if (fw) props.weight = fw[1] === 'bold' ? 700 : parseInt(fw[1]);
        var fi = body.match(/font-style:\s*italic/);
        if (fi) props.italic = true;
        if (Object.keys(props).length) map[cls] = props;
      }
      return map;
    }

    function mergeStyles(classList, map) {
      var result = {};
      for (var i = 0; i < classList.length; i++) {
        var s = map[classList[i]];
        if (s) Object.assign(result, s);
      }
      return result;
    }

    // Strip Google's classes/styles; keep semantic elements (strong, em, a)
    function cleanNode(node) {
      if (node.nodeType !== Node.ELEMENT_NODE) return;
      var tag = node.tagName;
      // Keep formatting attributes on <a>; strip class/style/id everywhere
      node.removeAttribute('style');
      node.removeAttribute('class');
      node.removeAttribute('id');
      if (tag === 'A') {
        var href = node.getAttribute('href') || '';
        if (href && !href.startsWith('#')) {
          node.setAttribute('target', '_blank');
          node.setAttribute('rel', 'noopener');
        }
      }
      Array.from(node.childNodes).forEach(cleanNode);
    }

    function processDoc(html) {
      var parser = new DOMParser();
      var doc = parser.parseFromString(html, 'text/html');
      var body = doc.body;

      // Build class-to-font-properties map from the embedded <style>
      var styleEl = doc.querySelector('style');
      var classMap = parseStyleBlock(styleEl ? styleEl.textContent : '');

      // PASS 0 — fix Google's flat-sibling nested list structure BEFORE stripping classes.
      // Google exports nested bullets as sibling <ul> elements tagged lst-kix_ID-0, -1, -2…
      // We move each level-N list into the last <li> of the closest preceding level-(N-1) list.
      (function fixNestedLists() {
        var allLists = Array.from(body.querySelectorAll('ul, ol'));
        // Process in reverse so deeper levels are handled before their parents.
        for (var i = allLists.length - 1; i >= 0; i--) {
          var list = allLists[i];
          var m = (list.className || '').match(/lst-kix_(\w+)-(\d+)/);
          if (!m) continue;
          var listId = m[1], level = parseInt(m[2]);
          if (level === 0) continue;
          // Walk backwards through the captured array to find the parent list.
          for (var j = i - 1; j >= 0; j--) {
            var candidate = allLists[j];
            var cm = (candidate.className || '').match(/lst-kix_(\w+)-(\d+)/);
            if (cm && cm[1] === listId && parseInt(cm[2]) === level - 1) {
              var lastLi = candidate.lastElementChild;
              if (lastLi && lastLi.tagName === 'LI') lastLi.appendChild(list);
              break;
            }
          }
        }
      })();

      // PASS 1 — convert <p> to heading elements based on inner span font sizes/weights
      Array.from(body.querySelectorAll('p')).forEach(function(p) {
        var classes = Array.from(p.classList);

        // p.title = Google Docs "Title" paragraph style
        if (classes.indexOf('title') !== -1) {
          var h1 = doc.createElement('h1');
          h1.innerHTML = p.innerHTML;
          p.replaceWith(h1);
          return;
        }

        // Measure the dominant font properties across non-empty spans
        var maxSize = 0, allBold = true, hasSpans = false;
        Array.from(p.querySelectorAll('span')).forEach(function(span) {
          if (!span.textContent.trim()) return;
          hasSpans = true;
          var s = mergeStyles(Array.from(span.classList), classMap);
          if (s.size && s.size > maxSize) maxSize = s.size;
          if (!s.weight || s.weight < 600) allBold = false;
        });

        var tag = null;
        if (maxSize >= 20) tag = 'h2';
        else if (maxSize >= 13 && hasSpans && allBold) tag = 'h3';

        if (tag) {
          var heading = doc.createElement(tag);
          heading.innerHTML = p.innerHTML;
          p.replaceWith(heading);
        }
      });

      // PASS 2 — convert bold/italic spans inside body paragraphs and list items
      // (heading spans are left alone — the heading style already implies bold)
      Array.from(body.querySelectorAll('p span, li span')).forEach(function(span) {
        if (!span.textContent.trim()) return;
        var s = mergeStyles(Array.from(span.classList), classMap);
        var bold = s.weight >= 600;
        var italic = s.italic;
        if (!bold && !italic) return;

        var inner = span.innerHTML;
        if (italic) inner = '<em>' + inner + '</em>';
        if (bold)   inner = '<strong>' + inner + '</strong>';

        var tmp = doc.createElement('span');
        tmp.innerHTML = inner;
        span.replaceWith(...tmp.childNodes);
      });

      // Remove Google's style/script blocks
      body.querySelectorAll('style, script').forEach(function(el) { el.remove(); });

      // Strip all remaining class/style/id attributes
      cleanNode(body);

      // Collapse consecutive blank paragraphs into one
      var prevBlank = false;
      Array.from(body.querySelectorAll('p')).forEach(function(p) {
        var blank = !p.textContent.trim();
        if (blank && prevBlank) p.remove();
        prevBlank = blank;
      });

      return body.innerHTML;
    }

    function slugify(text) {
      return text.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
    }

    function buildTOC() {
      var docBody = document.querySelector('.doc-body');
      var tocContainer = document.getElementById('toc-container');
      if (!docBody || !tocContainer) return;

      // Assign IDs to all headings
      var seen = {};
      Array.from(docBody.querySelectorAll('h1, h2, h3')).forEach(function(h, i) {
        var base = slugify(h.textContent.trim()) || ('s' + i);
        var id = seen[base] ? base + '-' + i : base;
        seen[base] = true;
        h.id = id;
      });

      // Build tree: h1 = section header, h2 = collapsible row, h3 = child
      var groups = [];
      var curGroup = null, curSection = null;
      Array.from(docBody.querySelectorAll('h1, h2, h3')).forEach(function(h) {
        var item = { text: h.textContent.trim(), id: h.id };
        if (h.tagName === 'H1') {
          curGroup = { header: item, sections: [] };
          curSection = null;
          groups.push(curGroup);
        } else if (h.tagName === 'H2') {
          if (!curGroup) { curGroup = { header: null, sections: [] }; groups.push(curGroup); }
          curSection = { heading: item, children: [] };
          curGroup.sections.push(curSection);
        } else if (h.tagName === 'H3' && curSection) {
          curSection.children.push(item);
        }
      });

      if (groups.length === 0) return;

      // Render as a single flat list — h1s are headers, h2s are collapsible rows (open by default)
      var html = '';
      groups.forEach(function(group, gi) {
        if (group.header) {
          html += '<div class="toc-group-header"><a href="#' + group.header.id + '">' + group.header.text + '</a></div>';
        }
        group.sections.forEach(function(sec, si) {
          var uid = 'toc-' + gi + '-' + si;
          var hasKids = sec.children.length > 0;
          html += '<div class="toc-h2-item"><div class="toc-h2-row">';
          if (hasKids) {
            html += '<button class="toc-chevron" aria-label="Toggle subsections" aria-expanded="false" aria-controls="' + uid + '" data-target="' + uid + '">›</button>';
          }
          html += '<a class="toc-h2-link" href="#' + sec.heading.id + '">' + sec.heading.text + '</a>';
          html += '</div>';
          if (hasKids) {
            html += '<ul class="toc-h3-list" id="' + uid + '">';
            sec.children.forEach(function(child) {
              html += '<li><a href="#' + child.id + '">' + child.text + '</a></li>';
            });
            html += '</ul>';
          }
          html += '</div>';
        });
      });

      tocContainer.innerHTML = '<nav class="toc" aria-label="Guide contents">' + html + '</nav>';

      // Chevron expand/collapse
      tocContainer.querySelectorAll('.toc-chevron').forEach(function(btn) {
        btn.addEventListener('click', function() {
          var list = document.getElementById(btn.getAttribute('data-target'));
          if (!list) return;
          var open = list.classList.toggle('open');
          btn.classList.toggle('open', open);
          btn.setAttribute('aria-expanded', open);
        });
      });

      // Smooth scroll (offset for fixed nav)
      tocContainer.querySelectorAll('a[href^="#"]').forEach(function(a) {
        a.addEventListener('click', function(e) {
          e.preventDefault();
          var el = document.getElementById(a.getAttribute('href').slice(1));
          if (el) {
            if (mobileGuide.matches) contents.open = false;
            var header = document.querySelector('.site-header');
            var offset = getComputedStyle(header).position === 'sticky' ? header.getBoundingClientRect().height + 24 : 24;
            window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - offset, behavior: window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'instant' : 'smooth' });
          }
        });
      });
    }

    function setupScrollSpy() {
      var tocContainer = document.getElementById('toc-container');
      if (!tocContainer) return;
      var headings = Array.from(document.querySelectorAll('.doc-body h1, .doc-body h2, .doc-body h3'));
      if (!headings.length) return;

      var lastId = null;
      var rafPending = false;

      function activate(id) {
        if (id === lastId) return;
        lastId = id;

        // Clear all active states
        tocContainer.querySelectorAll('.toc-active').forEach(function(el) { el.classList.remove('toc-active'); });

        // Find matching link
        var link = tocContainer.querySelector('a[href="#' + CSS.escape(id) + '"]');
        if (!link) return;
        link.classList.add('toc-active');

        // Auto-expand parent h3 list if needed
        var h3List = link.closest('.toc-h3-list');
        if (h3List && !h3List.classList.contains('open')) {
          h3List.classList.add('open');
          var chevron = tocContainer.querySelector('[data-target="' + h3List.id + '"]');
          if (chevron) { chevron.classList.add('open'); chevron.setAttribute('aria-expanded', 'true'); }
        }
      }

      function update() {
        var threshold = 110; // px below top of viewport to consider "current"
        var activeId = headings[0].id;
        for (var i = 0; i < headings.length; i++) {
          if (headings[i].getBoundingClientRect().top <= threshold) {
            activeId = headings[i].id;
          } else {
            break;
          }
        }
        activate(activeId);
        rafPending = false;
      }

      window.addEventListener('scroll', function() {
        if (!rafPending) { rafPending = true; requestAnimationFrame(update); }
      }, { passive: true });

      update(); // run once on load
    }

    async function loadGuide() {
      var container = document.getElementById('doc-content');
      try {
        var res = await fetch(EXPORT_URL);
        if (!res.ok) throw new Error(res.status);
        var html = await res.text();
        container.innerHTML = '<div class="doc-body">' + processDoc(html) + '</div>';
        buildTOC();
        setupScrollSpy();
      } catch (err) {
        console.error('Guide load error:', err);
        container.innerHTML = '<p class="empty-state">Could not load the guide right now. <a href="https://docs.google.com/document/d/' + DOC_ID + '/edit" target="_blank" rel="noopener">Open in Google Docs</a></p>';
      }
    }

    loadGuide();

  </script>
  <script src="nav.js"></script>
  <script src="footer.js"></script>
  <script src="nav-circle.js"></script>
</body>
</html>
